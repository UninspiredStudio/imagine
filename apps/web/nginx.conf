server {
    listen 8080;
    root /usr/share/nginx/html;

    # Compose's embedded DNS re-resolves imagine every `valid` seconds, so a recreated API container is found quickly.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The original URI, encoding included, passes through. X-Forwarded-For is left alone: the TLS proxy sets it and the
    # API rate-limits on it. The UI headers are added only in the UI locations, so API responses keep their own.
    # The UI API and token endpoint keep nginx's default buffering, timeouts and body limit. Auth requests run one at a
    # time in the API, so nginx must absorb slow clients here.
    location ~ ^/(api|token)(/|$) {
        set $imagine_upstream http://imagine:8080;
        proxy_pass $imagine_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location ~ ^/v2(/|$) {
        set $imagine_upstream http://imagine:8080;
        proxy_pass $imagine_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Blobs are streamed to the API, which enforces MAX_BLOB_BYTES itself.
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite names these files by content hash. A missing file is a 404, not index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Single-page app: a path that is not a file gets index.html, and the router renders it.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
