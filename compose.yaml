name: imagine

services:
  # ponytail: one replica, because uploads spool to a local volume. Use a shared volume or sticky routing for more.
  imagine:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: imagine-server
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://imagine:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/imagine
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      PLUNK_API_KEY: ${PLUNK_API_KEY:-}
      PLUNK_API_URL: ${PLUNK_API_URL:-https://api.useplunk.com}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in .env}
      S3_BUCKET: ${S3_BUCKET:-imagine}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES:-17179869184}
      PRESIGN_TTL_SECONDS: ${PRESIGN_TTL_SECONDS:-900}
      SPOOL_DIR: /spool
      SWEEP_SCHEDULE: "${SWEEP_SCHEDULE:-0 * * * *}"
    # Healthy means migrations ran and the server listens, so web starts after it.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/meta').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 2s
    volumes:
      - spool:/spool

  # Serves the web UI and proxies /api, /v2 and /token to imagine on the same origin.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      imagine:
        condition: service_healthy
    # Plain HTTP for your TLS proxy, bound to loopback so nothing else reaches it.
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imagine
      POSTGRES_USER: imagine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagine -d imagine"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Optional bundled S3, started with `--profile s3`. Plain HTTP on loopback; your proxy serves s3.<domain>.
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    # The signing key is checked here, not by Compose, so external-S3 setups never need it. Without it, the filer's
    # IAM gRPC port accepts unauthenticated calls from anything on this network, so the service refuses to start.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$WEED_JWT_FILER_SIGNING_KEY" ] || { echo "SEAWEEDFS_FILER_SIGNING_KEY must be set for the s3 profile" >&2; exit 1; }; exec /entrypoint.sh mini -dir=/data'
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-imagine}
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_FILER_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data

volumes:
  spool:
  postgres-data:
  seaweed-data:
